aid: motadata
name: Motadata
description: >-
  Motadata (Mindarray Systems) is a global IT software company running two AI-native platforms on
  a shared deep-learning foundation: ObserveOps, a unified observability and AIOps platform that
  brings metrics, logs, traces, flows and topology into one backend, and ServiceOps, an
  ITIL-aligned IT and enterprise service management suite covering service desk, CMDB, asset
  management, patch management and workflow automation. Both products are deployed in the
  customer's own environment, so every API host, credential and rate limit belongs to the
  customer rather than to Motadata. ObserveOps exposes a REST API at /api/v1 across 96
  configuration resource types plus a Vert.x EventBus websocket for live streams, and ships an
  official agent-first CLI that doubles as an MCP server with 22 tools and five packaged Agent
  Skills. ServiceOps exposes a documented REST API over OAuth 2.0 or an API key across request,
  problem, change, release, CMDB, asset and service-catalog objects. Motadata publishes no
  OpenAPI for either product.
