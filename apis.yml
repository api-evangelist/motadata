apis:
  - aid: motadata:observeops
    name: Motadata ObserveOps
    description: >-
      ObserveOps (formerly Motadata AIOps) is a unified observability platform correlating
      metrics, logs, traces, flows and topology with anomaly detection that needs no training
      period. Its REST API is mounted at /api/v1 across three mounts (/settings, /visualization,
      /system) covering 96 configuration resource types, with a Vert.x EventBus websocket bridge
      for live alerts, events and real-time queries. Authentication is a Personal Access Token,
      a static client.id cookie, or a username/password session; the websocket surface requires
      the session. Errors come back as proprietary MD-prefixed codes rather than RFC 9457
      problem documents, and Motadata publishes no OpenAPI.
    humanURL: https://www.motadata.com/products/observeops
    baseURL: https://{observeops-host}/api/v1
    tags:
      - AIOps
      - Observability
      - Monitoring
      - Log Management
    properties:
      - type: Documentation
        url: https://docs.motadata.com/observeops-docs/
      - type: APIReference
        url: https://docs.motadata.com/observeops-docs/API%20Documentation/observeops-api-documentation
      - type: ReleaseNotes
        url: https://docs.motadata.com/observeops-docs/motadata-release-notes/overview
      - type: DataModel
        url: data-model/motadata-data-model.yml
      - type: ErrorCatalog
        url: errors/motadata-problem-types.yml
      - type: MCPServer
        url: mcp/motadata-mcp.yml
      - type: AgentSkill
        url: skills/_index.yml
      - type: CLI
        url: cli/motadata-cli.yml
    x-base-url-note: >-
      Templated on purpose. ObserveOps is deployed on the customer's own infrastructure; the CLI
      prompts for the host at `observeops auth login`. There is no Motadata-operated API host.
  - aid: motadata:serviceops
    name: Motadata ServiceOps
    description: >-
      ServiceOps is Motadata's AI-powered, ITIL-aligned IT and enterprise service management
      suite. Its REST API lets third-party systems create, read, update and delete requests,
      problems, changes, releases, service requests, conversations, assets, hardware components,
      CMDB configuration items and discovery components, plus system-field and user-management
      lookups, across roughly 106 documented endpoint pages. Authentication is either an OAuth
      2.0 password grant at /api/oauth/token or an API key sent as `Authorization: Apikey <key>`.
      A configurable token-bucket rate limiter (20 requests/second, burst 30 by default) signals
      through X-RateLimit-* headers. Motadata publishes no OpenAPI.
    humanURL: https://www.motadata.com/products/serviceops
    baseURL: https://{serviceops-host}/api
    tags:
      - ITSM
      - Service Desk
      - Asset Management
      - CMDB
    properties:
