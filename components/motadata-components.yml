description: >-
  A Motadata-branded ObserveOps design system is published to npm as framework-agnostic Web
  Components with an `obs-` custom element prefix, alongside a design-token/CSS package and a
  machine-readable spec package intended to be served to coding agents through its own MCP
  server. These are UI components for building against or alongside ObserveOps, distinct from
  the RUM SDKs in packages/motadata-packages.yml, which instrument a page rather than render one.
caveat: >-
  Provenance is NOT confirmed first-party. The packages are scoped to the @mtdt npm org and are
  explicitly named for Motadata ObserveOps, but they declare no repository, github.com/mtdt has
  no public repos, and they are published by a single personal maintainer account
  (niravbhatt1317). Recorded as Motadata-branded; not credited to Motadata as an official
  developer surface.
