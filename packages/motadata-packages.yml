specification: API Commons Packages
specificationVersion: '0.1'
provider: Motadata
providerId: motadata
generated: '2026-08-29'
method: searched
source: >-
  registry.npmjs.org (search + per-package metadata), repo.packagist.org, api.github.com
  (github.com/motadata2025, github.com/pmg-motadata), probed 2026-08-29. PyPI, RubyGems,
  crates.io and NuGet were queried for Motadata-named packages and returned nothing.
description: >-
  First-party client libraries, SDKs, agents and tooling published by Motadata (Mindarray
  Systems). Motadata does not publish a REST client SDK for the ObserveOps or ServiceOps
  APIs; what it does publish is a CLI (which is also an MCP server), Real User Monitoring
  browser and mobile SDKs, APM custom-instrumentation helpers per language, and a design-system
  component set. Several instrumentation libraries are distributed from GitHub only, with no
  package-registry release — their version is read from the repository's git tag.
registries_checked:
  - registry: npm
    result: hit
  - registry: packagist
    result: hit
  - registry: pypi
    result: none
    note: motadata, motadata-apm, motadata_apm, motadata-apm-instrumentation all 404.
  - registry: rubygems
    result: none
    note: motadata-apm, motadata_apm, motadata-instrumentation all report "could not be found"; the Ruby gem is GitHub-distributed.
  - registry: nuget
    result: none
  - registry: crates.io
    result: none
  - registry: maven-central
    result: none
packages:
  - name: observeops
    registry: npm
    url: https://www.npmjs.com/package/observeops
    version: 2.3.1
    published: '2026-08-22'
    official: true
    language: TypeScript
    kind: cli
    description: >-
      Official command line interface for Motadata ObserveOps (AIOps). Built AI-agent-first:
      every command speaks --json, exit codes are a documented contract, and `observeops mcp`
      runs the platform as an MCP server. Bundles five Agent Skills.
    install: npm install -g observeops
    binaries:
      - observeops
      - mdcli
    repository: https://github.com/pmg-motadata/cli
    note: >-
      The npm README describes it as "the official command line interface for the Motadata
      ObserveOps (AIOps) observability platform". Its documentation links point at
      http://172.16.12.186:3333/ — an RFC 1918 private address — so the CLI's own docs site is
      not publicly reachable; the package README and bundled skills are the public documentation.
  - name: '@mtdt/observeops-ds-mcp'
    registry: npm
    url: https://www.npmjs.com/package/@mtdt/observeops-ds-mcp
    version: 0.4.5
    published: '2026-08-12'
    official: false
    language: TypeScript
    kind: mcp-server
    description: >-
      MCP server for the Motadata ObserveOps design system; serves @mtdt/observeops-ds-spec to
      coding agents. Ships both a stdio and an HTTP binary.
    install: npx -y @mtdt/observeops-ds-mcp
    binaries:
      - observeops-ds-mcp
      - observeops-ds-mcp-http
    note: >-
      Marked official:false deliberately. It is Motadata-branded and scoped to the @mtdt npm org,
      but it is published by a single personal maintainer account (niravbhatt1317), declares no
      repository, and github.com/mtdt exposes no public repos — so first-party status could not
      be confirmed from a Motadata-controlled surface.
  - name: '@mtdt/observeops-ds-spec'
    registry: npm
    url: https://www.npmjs.com/package/@mtdt/observeops-ds-spec
    version: 0.1.208
    published: '2026-08-12'
