summary:
  total: 20
  official: 15
  registry_published: 11
  github_only: 9
  sdk_note: >-
    None of these is a REST client SDK for the ObserveOps or ServiceOps HTTP APIs. The nearest
    thing is the `observeops` CLI, which wraps the ObserveOps API (login, token refresh,
    self-signed TLS, response envelope, pagination, name-to-id resolution) and is the library
    Motadata's own agent skills tell an agent to use instead of curl.
