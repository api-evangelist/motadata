specification: API Commons Error Catalog
specificationVersion: '0.1'
provider: Motadata
providerId: motadata
generated: '2026-08-29'
method: derived
source: npm observeops@2.3.1 — src/data/error-codes.json, embedded verbatim in the published dist/index.js bundle.
description: Motadata ObserveOps returns a product-specific MD-prefixed error code in its response envelope rather
  than an RFC 9457 problem document. This is the platform error table Motadata ships inside its own official CLI,
  mirrored here verbatim.
format: proprietary
rfc9457: false
envelope:
  code_field: code
  code_pattern: ^MD\d{3}$
  success_code: MD000
  note: MD000 means success — the envelope carries a code on every response, not only failures.
quirks:
- Unknown or unmounted API paths answer MD022 "Unauthorized access" rather than HTTP 404, so a 200-with-MD022 is
  the real "not found".
- Non-API paths are answered by the single-page app with HTTP 200 and an HTML body; the official CLI detects and
  refuses this.
- Payload validation failures collapse into a single MD022 per round trip, one error at a time — the reason Motadata
  ships entity schemas in the CLI for local validation before sending.
