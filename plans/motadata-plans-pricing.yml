description: >-
  Motadata publishes no pricing. www.motadata.com/pricing returns HTTP 404, the company's own
  llms.txt — a curated map of every page it wants an agent to read — lists no pricing page, and
  the only routes to a number are a demo request form and a free trial form. The comparison hub
  at /comparison is described as covering "feature and pricing comparisons" but prices
  competitors, not Motadata. Both products are quote-and-license, sold through sales and
  partners, and both are deployed in the customer's own environment, so there is no API plan,
  no metered tier and no self-serve signup that would produce one.
  This file replaced a 2026-05-04 bulk-sweep scaffold that invented free / professional /
  enterprise tiers with per-month request quotas. None of those exist.
